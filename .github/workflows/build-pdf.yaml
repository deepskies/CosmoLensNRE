on: [push, pull_request]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    container: 
      image: pandoc/latex:latest  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        run: |
          pandoc  -f markdown -t pdf --standalone -o paper/paper.pdf  -M date="$(date +'%Y-%m-%d')" paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf